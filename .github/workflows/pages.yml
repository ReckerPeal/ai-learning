name: Deploy to GitHub Pages

# 任何推到 main 的提交自动发布；也可在 Actions 页面手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

# 不允许并发部署（多次推送排队，最新一次胜出）
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 整个仓库即静态站点；如未来新增构建步骤，改成 ./dist 之类
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
